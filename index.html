<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Ajayveer Sandhu — Computational Mathematics at the University of Waterloo. Selected work, on air." />
    <title>Ajayveer Sandhu</title>
    <link rel="stylesheet" href="/style.css?v=4" />
    <link rel="stylesheet" href="/room.css?v=3" />
    <script src="/main.js?v=3" defer></script>
  </head>
  <body>
    <div class="cyber-room" aria-hidden="true"><div class="room-architecture"></div><div class="room-light"></div></div>
    <header class="topbar">
      <button class="volume" id="volume" aria-label="Volume: half. Set to full">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="wave-small" d="M15 8a6 6 0 0 1 0 8"/><path class="wave-large" d="M18 5a10 10 0 0 1 0 14"/></svg>
        <span id="volume-label">50%</span>
      </button>
    </header>
    <main class="stage">
      <section class="introduction" aria-labelledby="name">
        <div class="identity">
          <div class="name-row">
            <h1 id="name">Ajayveer Sandhu</h1>
            <nav class="socials" aria-label="Personal links">
              <button type="button" class="social" aria-label="GitHub"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.7 5.39-5.26 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg></button>
              <button type="button" class="social" aria-label="LinkedIn"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9.75h4V21H3zM9.5 9.75h3.83v1.54h.06c.53-1 1.84-2.06 3.79-2.06 4.05 0 4.8 2.67 4.8 6.13V21h-4v-4.98c0-1.19-.02-2.72-1.66-2.72-1.66 0-1.92 1.3-1.92 2.63V21h-4z"/></svg></button>
              <button type="button" class="social" aria-label="Email"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="1.5"/><path d="m3 6 9 7 9-7"/></svg></button>
              <button type="button" class="social" aria-label="Résumé"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 2.5h8l4.5 4.5v14.5H6z"/><path d="M14 2.5V7h4.5M9 11h6M9 14.5h6M9 18h4"/></svg></button>
            </nav>
          </div>
          <p class="role">Computational Mathematics Student <span>@ UWaterloo</span></p>
        </div>
        <section class="work" aria-label="Experience">
          <p class="section-label">EXPERIENCE</p>
          <div class="experience-list" id="experience-list" inert>
            <button class="experience" data-channel="fincapes" aria-pressed="false"><span class="year">2026</span><strong class="company">Fincapes</strong><span class="title">Data Scientist</span><span class="dates">Sep – Dec</span><span class="selection" aria-hidden="true"></span></button>
            <button class="experience" data-channel="statcan" aria-pressed="false"><span class="year">2026</span><strong class="company">Statistics Canada</strong><span class="title">Data Engineer</span><span class="dates">Jan – Apr</span><span class="selection" aria-hidden="true"></span></button>
            <button class="experience" data-channel="zocratic" aria-pressed="false"><span class="year">2025</span><strong class="company">ZocraticMMA</strong><span class="title">Co-Creator</span><span class="dates"></span><span class="selection" aria-hidden="true"></span></button>
          </div>        </section>
      </section>
      <section class="television-area" aria-label="Interactive television">
        <div class="television" id="television">
          <div class="bezel"><div class="glass" id="glass">
            <div class="off-screen" id="off-screen">NO SIGNAL</div>
            <div class="channel" id="channel" hidden aria-live="polite"></div>
            <div class="static" id="static" aria-hidden="true"></div>
            <div class="glass-reflection" aria-hidden="true"></div>
          </div></div>
          <div class="tv-controls">
            <div class="power-well"><button id="power" class="power" aria-label="Turn on television"></button></div>
          </div>
        </div>
        <div class="tv-feet" aria-hidden="true"><i></i><i></i></div>
        <div class="tv-caption"><span id="broadcast-status">STANDBY</span><span id="power-hint">Make yourself at home. Press the red button.</span></div>
      </section>
    </main>
  </body>
</html>
